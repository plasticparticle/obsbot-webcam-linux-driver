[package]
name = "obsbot-gui"
description = "Native control center for OBSBOT cameras on Linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "obsbot-control-center"
path = "src/main.rs"

[dependencies]
obsbot-core = { path = "../obsbot-core" }
eframe = "0.32"
v4l = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
